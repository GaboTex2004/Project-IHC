name: pet_track 

services:
  pet_track_db:
    env_file: ./.env
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1']

      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mi-red
  
  pet_track_backend:
    build:
      context: ./pet_track_backend
      dockerfile: ./Dockerfile.dev
    env_file: ./pet_track_backend/.env
    image: sebastiandevjs/pet_track_backend:lastest
    volumes:
      - media-files:/app/media
      - static-files:/app/staticfiles

    ports:
      - '${SERVER_PORT}:${SERVER_PORT}'
    networks:
      - mi-red # Conectar a la misma red para que se puedan comunicar
    environment:
      - PYTHONDONTWRITEBYTECODE=1 # Evitar python .pyc y buffer
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    depends_on:
      pet_track_db:
        condition: service_healthy # Espera a que la db este OK
    
  pet_track_mobile:
    build:
      context: ./pet_track_mobile
      dockerfile: Dockerfile.dev
    env_file: ./pet_track_mobile/.env
    image: sebastiandevjs/pet_track_mobile:latest
    restart: unless-stopped
    ports:
      - "5200:80"
    networks:
      - mi-red

volumes:
  media-files:
  static-files:
  postgres-data:
  node-modules:

networks:
  mi-red:
    driver: bridge