services:
  pet_track_db:
    env_file:
      - ./pet_track_backend/.env
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1']

      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - mi-red

volumes:
  postgres-data:
  node-modules:

networks:
  mi-red:
    driver: bridge