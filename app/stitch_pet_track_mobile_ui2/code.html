<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col pb-24">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-[0px_4px_12px_rgba(51,65,85,0.05)] z-40">
<div class="flex justify-between items-center px-container-margin py-md">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed" data-icon="pets" style="font-variation-settings: 'FILL' 1;">pets</span>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed">Pet Track</h1>
</div>
<!-- Optional Secondary Action/Profile could go here -->
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow px-container-margin py-lg flex flex-col gap-lg max-w-2xl mx-auto w-full">
<!-- Header Section -->
<div class="flex flex-col gap-xs">
<h2 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface">Reportar Mascota Perdida</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Por favor, proporciona toda la información posible para ayudar a encontrarla.</p>
</div>
<!-- Add Photo Area -->
<div class="w-full relative rounded-[24px] bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center p-xl gap-sm cursor-pointer hover:bg-surface-container-highest transition-colors min-h-[200px]" onclick="document.getElementById('photo-upload').click()">
<input accept="image/*" class="hidden" id="photo-upload" type="file"/>
<span class="material-symbols-outlined text-4xl text-primary" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label-md text-label-md text-primary">Añadir Foto</span>
<span class="font-label-sm text-label-sm text-on-surface-variant text-center max-w-[200px]">Sube una foto clara donde se vean las características de la mascota.</span>
</div>
<!-- Form Fields -->
<form class="flex flex-col gap-lg">
<!-- Nombre -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="pet-name">Nombre de la Mascota</label>
<input class="w-full h-[56px] px-md rounded-lg border border-[#E2E8F0] focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md outline-none transition-colors" id="pet-name" placeholder="Ej. Max, Luna..." type="text"/>
</div>
<!-- Características -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="pet-features">Características principales</label>
<textarea class="w-full px-md py-sm rounded-lg border border-[#E2E8F0] focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md outline-none transition-colors resize-none" id="pet-features" placeholder="Raza, color, tamaño, marcas particulares, si lleva collar..." rows="4"></textarea>
</div>
<!-- Ubicación -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="pet-location">Última ubicación geográfica</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="location_on">location_on</span>
</div>
<input class="w-full h-[56px] pl-[48px] pr-md rounded-lg border border-[#E2E8F0] focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md outline-none transition-colors" id="pet-location" placeholder="Calle, parque, barrio..." type="text"/>
</div>
</div>
<!-- Fecha -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="pet-date">Fecha de pérdida</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="calendar_today">calendar_today</span>
</div>
<input class="w-full h-[56px] pl-[48px] pr-md rounded-lg border border-[#E2E8F0] focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md outline-none transition-colors text-on-surface-variant" id="pet-date" type="date"/>
</div>
</div>
<!-- Contacto -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="contact-info">Información de contacto</label>
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="phone">phone</span>
</div>
<input class="w-full h-[56px] pl-[48px] pr-md rounded-lg border border-[#E2E8F0] focus:border-primary focus:ring-1 focus:ring-primary bg-surface-container-lowest text-on-surface font-body-md outline-none transition-colors" id="contact-info" placeholder="Teléfono o Email" type="tel"/>
</div>
</div>
<!-- Submit Button (Prominent Action) -->
<button class="mt-md w-full h-[56px] rounded-lg bg-secondary-container text-on-secondary-container font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-[0px_8px_20px_rgba(51,65,85,0.12)] hover:bg-secondary-fixed-dim active:scale-95 transition-all duration-200" type="button">
<span class="material-symbols-outlined" data-icon="campaign">campaign</span>
                Publicar Reporte
            </button>
</form>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface dark:bg-surface-container-lowest shadow-[0px_-8px_20px_rgba(51,65,85,0.12)] flex justify-around items-center h-16 px-4 md:hidden">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1.5 hover:bg-surface-container-highest transition-all active:scale-90 duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</a>
<!-- Report (Active - as this is the reporting screen) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-4 py-1.5 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="add_circle" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm mt-1">Report</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1.5 hover:bg-surface-container-highest transition-all active:scale-90 duration-200 rounded-full" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</a>
</nav>
</body></html>
