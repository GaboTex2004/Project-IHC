<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Track - Reportar mascota perdida</title>
    <style>
      /* 1. Jerarquía y Espaciado (Escala de 8px) */
      :root {
        --space-1: 8px;
        --space-2: 16px;
        --space-3: 24px;
        --space-4: 32px;

        /* Paleta estricta: Blanco, Negro y Grises */
        --ink: #000000;
        --muted: #666666;
        --paper: #f5f5f5;
        --white: #ffffff;
        --border: #cccccc;
        --primary: #000000;

        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        font-family: Inter, system-ui, sans-serif;
      }

      body {
        background: var(--paper);
        color: var(--ink);
        margin: 0;
        display: flex;
        justify-content: center;
        padding: var(--space-4) var(--space-2);
      }

      /* 2. Layout: Contenedor tipo móvil (mobile-first) */
      .app-screen {
        background: var(--white);
        width: 100%;
        max-width: 420px;
        border-radius: var(--radius);
        box-shadow: 0 18px 55px rgba(0, 0, 0, 0.1);
        padding: var(--space-4) var(--space-3);
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
      }

      .topbar h1 {
        font-size: 1.1rem;
        margin: 0;
        font-weight: 800;
      }

      .back-btn {
        background: none;
        border: none;
        font-size: 1.2rem;
        cursor: pointer;
        padding: 0;
        color: var(--ink);
      }

      /* Agrupación de contenido (Layout) */
      .form-group {
        margin-bottom: var(--space-4);
      }

      .group-title {
        font-size: 0.8rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: var(--space-2);
        font-weight: 800;
        border-bottom: 1px solid var(--border);
        padding-bottom: var(--space-1);
      }

      .input-wrapper {
        margin-bottom: var(--space-2);
      }

      label {
        display: block;
        margin-bottom: var(--space-1);
        font-weight: 600;
        font-size: 0.85rem;
      }

      input,
      textarea,
      select {
        width: 100%;
        padding: 12px var(--space-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--paper);
        font-size: 0.95rem;
        color: var(--ink);
        transition: border-color 0.2s;
      }

      input:focus,
      textarea:focus,
      select:focus {
        outline: none;
        border-color: var(--ink);
      }

      .photo-upload {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-1);
        border: 2px dashed #999999;
        padding: var(--space-4);
        text-align: center;
        border-radius: var(--radius);
        color: var(--muted);
        background: #fafafa;
        margin-bottom: var(--space-3);
        cursor: pointer;
      }

      .photo-upload:hover {
        background: #eeeeee;
        border-color: #666666;
      }

      /* 3. Acción principal destacada */
      .btn-primary {
        width: 100%;
        padding: var(--space-2);
        background: var(--primary);
        color: var(--white);
        border: none;
        border-radius: 10px;
        font-weight: 800;
        font-size: 0.9rem;
        cursor: pointer;
        margin-top: var(--space-2);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .btn-primary:hover {
        background: #333333;
      }
    </style>
  </head>
  <body>
    <main class="app-screen">
      <!-- Orientación -->
      <header class="topbar">
        <button class="back-btn">←</button>
        <h1>Reportar mascota perdida</h1>
      </header>

      <form>
        <!-- Grupo 1: Información -->
        <section class="form-group">
          <div class="photo-upload">
            <span style="font-size: 2rem">📷</span>
            <span>Agregar foto de la mascota</span>
          </div>

          <div class="input-wrapper">
            <label>Nombre</label>
            <input type="text" placeholder="Ej. Toby" />
          </div>

          <div class="input-wrapper">
            <label>Especie</label>
            <select>
              <option value="" disabled selected>
                Selecciona una opción...
              </option>
              <option value="perro">Perro</option>
              <option value="gato">Gato</option>
              <option value="otro">Otro</option>
            </select>
          </div>

          <div class="input-wrapper">
            <label>Características distintivas</label>
            <textarea
              placeholder="Ej. Collar rojo, mancha en el ojo izquierdo..."
              rows="3"
            ></textarea>
          </div>
        </section>

        <!-- Grupo 2: Ubicación y Tiempo -->
        <section class="form-group">
          <div class="input-wrapper">
            <label>Último avistamiento</label>
            <input type="text" placeholder="Ej. Parque Arenal, 1er Anillo" />
          </div>

          <div class="input-wrapper">
            <label>Fecha en que se perdió</label>
            <input type="date" />
          </div>
        </section>

        <!-- Grupo 3: Contacto -->
        <section class="form-group">
          <div class="input-wrapper">
            <label>Teléfono móvil</label>
            <input type="tel" placeholder="Ej. 70000000" />
          </div>
        </section>

        <!-- Acción -->
        <button type="button" class="btn-primary">Revisar y Publicar</button>
      </form>
    </main>
  </body>
</html>
